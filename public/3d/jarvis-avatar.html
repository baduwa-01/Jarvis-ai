<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>J.A.R.V.I.S. Holographic Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #canvas-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
  #hud-overlay {
    position: absolute;
    bottom: 2px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .hud-badge {
    background: rgba(0, 240, 255, 0.12);
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-radius: 12px;
    padding: 2px 8px;
    font-family: monospace;
    font-size: 8.5px;
    color: #07365C;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-weight: bold;
  }
</style>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud-overlay">
  <div id="hud-status" class="hud-badge">HOLO-3D: INITIALIZING...</div>
</div>

<script>
let scene, camera, renderer;
let avatarGroup, faceMesh, eyesMesh, jawGroup, holoRings = [], particles, hairMesh, cylinderMesh;
let leftEyeGroup, rightEyeGroup, leftEyelid, rightEyelid;
let featureCylinderGroup = null, featureCylinderVisible = false, featureCylinderTargetY = 0;
let featureRaycaster = null, featurePointer = null, pointerStartX = 0, pointerStartY = 0, pointerMoved = false;
const featureCardMeshes = [];
let glbModel = null;
let wireframeOverlays = [];
let morphTargets = {};
let isGlbLoaded = false;
let isSpeaking = false;
let visemeValue = 0.0;
let targetViseme = 0.0;
let clock = new THREE.Clock();
let isPointerDown = false;
let pointerX = 0, pointerY = 0;
let targetRotationX = 0, targetRotationY = 0;

// Natural human eye blinking & saccade tracking
let nextBlinkTime = 2.0;
let isBlinking = false;
let blinkProgress = 0.0;
let nextEyeMoveTime = 1.5;
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;

function reportStatus(msg) {
  const el = document.getElementById('hud-status');
  if (el) el.innerText = msg;
  if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    try { window.ReactNativeWebView.postMessage('MODEL_STATUS:' + msg); } catch(e){}
  }
  if (window.AndroidBridge && window.AndroidBridge.onModelStatus) {
    try { window.AndroidBridge.onModelStatus(msg); } catch(e){}
  }
}

function init() {
  const container = document.getElementById('canvas-container');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.set(0, 0, 7.0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  // Holographic Studio Lighting: Soft icy ambient + cyan key + electric magenta rim
  const ambient = new THREE.AmbientLight(0xE0F2FE, 1.1);
  scene.add(ambient);

  const cyanKey = new THREE.DirectionalLight(0x00F0FF, 2.5);
  cyanKey.position.set(3, 4, 5);
  scene.add(cyanKey);

  const magentaRim = new THREE.DirectionalLight(0xFF3DDB, 2.0);
  magentaRim.position.set(-3.5, -2, -3);
  scene.add(magentaRim);

  const topHoloLight = new THREE.PointLight(0x00F0FF, 2.8, 12);
  topHoloLight.position.set(0, 3, 2);
  scene.add(topHoloLight);

  avatarGroup = new THREE.Group();
  scene.add(avatarGroup);

  // Load GLB or high-fidelity procedural 3D face
  loadGlbOrFallback();

  // Surrounding transparent holographic cylinder and elegant cyan/magenta rings
  createHoloHUD();
  createFeatureCylinder();

  // Floating ambient cyber particles
  createParticles();

  // Touch / pointer listeners
  setupInteractions();

  window.addEventListener('resize', onWindowResize);
  animate();
}

function loadGlbOrFallback() {
  // Load the user-provided J.A.R.V.I.S. model from the local Android assets folder.
  // Keep the procedural avatar as a safe fallback if the model cannot be loaded.
  if (THREE.GLTFLoader) {
    const loader = new THREE.GLTFLoader();
    loader.load(
      'textured_mesh.glb',
      function (gltf) {
        glbModel = gltf.scene;
        const bounds = new THREE.Box3().setFromObject(glbModel);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());
        const largest = Math.max(size.x, size.y, size.z) || 1;
        const targetSize = 2.65;
        const scale = targetSize / largest;
        glbModel.scale.setScalar(scale);
        glbModel.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
        // Keep the supplied GLB geometry, but render it as a cyan holographic wireframe.
        // The original mesh is not replaced with a different model; only its display materials change.
        const sourceMeshes = [];
        glbModel.traverse(function (obj) {
          if (!obj.isMesh) return;
          obj.frustumCulled = false;
          sourceMeshes.push(obj);
          if (obj.morphTargetDictionary && obj.morphTargetInfluences) {
            Object.keys(obj.morphTargetDictionary).forEach(function (name) {
              morphTargets[name.toLowerCase()] = { mesh: obj, index: obj.morphTargetDictionary[name] };
            });
          }
        });

        sourceMeshes.forEach(function (obj) {
          // A very dark translucent base preserves the silhouette while the lines define the face.
          const oldMaterials = Array.isArray(obj.material) ? obj.material : [obj.material];
          oldMaterials.forEach(function (mat) { if (mat && mat.dispose) mat.dispose(); });
          obj.material = new THREE.MeshBasicMaterial({
            color: 0x00182b,
            transparent: true,
            opacity: 0.24,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          obj.material.needsUpdate = true;

          // WireframeGeometry follows the existing model's actual triangulated mesh.
          const wireGeometry = new THREE.WireframeGeometry(obj.geometry);
          const wireMaterial = new THREE.LineBasicMaterial({
            color: 0x48eaff,
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true
          });
          const wire = new THREE.LineSegments(wireGeometry, wireMaterial);
          wire.name = 'JARVIS_CYAN_WIREFRAME';
          wire.renderOrder = 2;
          obj.add(wire);
          wireframeOverlays.push(wire);
        });

        avatarGroup.add(glbModel);
        isGlbLoaded = true;
        reportStatus('J.A.R.V.I.S. CYAN WIREFRAME: READY');
      },
      undefined,
      function (error) {
        console.error('J.A.R.V.I.S. GLB load failed:', error);
        createProceduralHumanFace();
        reportStatus('3D MODEL UNAVAILABLE — FALLBACK ACTIVE');
      }
    );
  } else {
    createProceduralHumanFace();
    reportStatus('3D LOADER UNAVAILABLE — FALLBACK ACTIVE');
  }
}


function createFeatureCylinder() {
  featureCylinderGroup = new THREE.Group();
  featureCylinderGroup.visible = false;
  scene.add(featureCylinderGroup);
  featureRaycaster = new THREE.Raycaster();
  featurePointer = new THREE.Vector2();

  const shell = new THREE.Mesh(
    new THREE.CylinderGeometry(1.62, 1.62, 3.05, 48, 1, true),
    new THREE.MeshBasicMaterial({color: 0x00eaff, transparent: true, opacity: 0.055, side: THREE.DoubleSide, depthWrite: false, wireframe: true})
  );
  shell.position.set(0, -0.05, 0);
  featureCylinderGroup.add(shell);

  [1.53, -1.53].forEach(function(y, index) {
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(1.62, 0.025, 8, 64),
      new THREE.MeshBasicMaterial({color: index === 0 ? 0xff3ddb : 0x00f0ff, transparent: true, opacity: 0.9})
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = y;
    featureCylinderGroup.add(rim);
  });

  const features = [
    ['WEATHER', 'Live forecast'], ['MUSIC', 'Audio controls'], ['DEVICE', 'Phone tools'], ['AUTOMATION', 'Quick actions'],
    ['MEMORY', 'Conversation'], ['SECURITY', 'Protection'], ['NETWORK', 'Connectivity'], ['SYSTEM', 'Diagnostics'],
    ['TASKS', 'Task manager'], ['VOICE', 'Speech tools'], ['BATTERY', 'Power status'], ['ACTIVITY', 'System activity']
  ];
  const rowY = [0.88, 0, -0.88];
  const cardAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];

  function makeCardTexture(title, subtitle, index) {
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 240;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 512, 240);
    gradient.addColorStop(0, 'rgba(3,35,73,0.95)'); gradient.addColorStop(1, 'rgba(5,83,120,0.83)');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 512, 240);
    ctx.strokeStyle = index % 3 === 0 ? '#ff3ddb' : '#00f0ff'; ctx.lineWidth = 6;
    ctx.strokeRect(7, 7, 498, 226);
    ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 29px Arial'; ctx.fillText('◈  J.A.R.V.I.S. MODULE', 28, 48);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 48px Arial'; ctx.fillText(title, 28, 126);
    ctx.fillStyle = '#a8efff'; ctx.font = '26px Arial'; ctx.fillText(subtitle, 28, 177);
    ctx.fillStyle = index % 3 === 0 ? '#ff3ddb' : '#00f0ff'; ctx.fillRect(28, 198, 110 + (index % 4) * 28, 5);
    const texture = new THREE.CanvasTexture(canvas); if (THREE.sRGBEncoding !== undefined) texture.encoding = THREE.sRGBEncoding; return texture;
  }

  features.forEach(function(feature, index) {
    const row = Math.floor(index / 4); const col = index % 4; const angle = cardAngles[col];
    const material = new THREE.MeshBasicMaterial({map: makeCardTexture(feature[0], feature[1], index), transparent: true, opacity: 0.96, side: THREE.DoubleSide, depthWrite: false});
    const card = new THREE.Mesh(new THREE.PlaneGeometry(0.94, 0.44), material);
    const radius = 1.64;
    card.position.set(Math.sin(angle) * radius, rowY[row], Math.cos(angle) * radius);
    card.rotation.y = angle;
    card.userData.featureName = feature[0][0] + feature[0].slice(1).toLowerCase();
    featureCylinderGroup.add(card); featureCardMeshes.push(card);
  });
}

function rotateFeatureCylinder(direction) {
  if (!featureCylinderGroup) return;
  featureCylinderTargetY += direction * Math.PI / 2;
}

function selectFeatureAt(clientX, clientY) {
  if (!featureCylinderVisible || !renderer || !featureRaycaster) return;
  const rect = renderer.domElement.getBoundingClientRect();
  featurePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  featurePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  featureRaycaster.setFromCamera(featurePointer, camera);
  const hits = featureRaycaster.intersectObjects(featureCardMeshes, false);
  if (hits.length && window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    window.ReactNativeWebView.postMessage('FEATURE:' + hits[0].object.userData.featureName);
  }
}

function createProceduralHumanFace() {
  const headGroup = new THREE.Group();

  // 1. Human Face Anatomy (high-poly subdivision with taper, nose, eye sockets, chin, cheekbones)
  const faceGeo = new THREE.IcosahedronGeometry(1.5, 5);
  const pos = faceGeo.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    // Anatomical taper: jaw narrows down gracefully
    if (y < -0.1) {
      x *= (1.0 + (y + 0.1) * 0.28);
      z *= (1.0 + (y + 0.1) * 0.18);
    }
    y *= 1.28;
    x *= 0.85;

    // Nose bridge & tip protrusion
    if (z > 0.45 && y > -0.3 && y < 0.35 && Math.abs(x) < 0.35) {
      z += 0.38 * (1.0 - Math.abs(x) * 2.5);
    }
    // Eye sockets depth
    if (z > 0.65 && Math.abs(x) > 0.28 && Math.abs(x) < 0.75 && y > 0.05 && y < 0.42) {
      z -= 0.18;
    }
    // High sculpted cheekbones
    if (z > 0.45 && Math.abs(x) > 0.55 && y > -0.15 && y < 0.25) {
      x *= 1.16;
      z += 0.14;
    }
    // Defined chin
    if (y < -1.1 && z > 0.2) {
      z += 0.18;
    }

    pos.setXYZ(i, x, y, z);
  }
  faceGeo.computeVertexNormals();

  // Realistic digital cyber skin material with cyan rim and subsurface glow
  const skinMat = new THREE.MeshStandardMaterial({
    color: 0x8CD2F5,
    roughness: 0.25,
    metalness: 0.6,
    emissive: 0x072B4D,
    emissiveIntensity: 0.45
  });
  faceMesh = new THREE.Mesh(faceGeo, skinMat);
  headGroup.add(faceMesh);

  // Overlay delicate cyber circuits lattice
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0x00F0FF,
    wireframe: true,
    transparent: true,
    opacity: 0.26
  });
  const wireOverlay = new THREE.Mesh(faceGeo, wireMat);
  wireOverlay.scale.set(1.008, 1.008, 1.008);
  headGroup.add(wireOverlay);

  // 2. Swept dark hair volume
  const hairGeo = new THREE.SphereGeometry(1.48, 28, 28);
  const hairPos = hairGeo.attributes.position;
  for (let i = 0; i < hairPos.count; i++) {
    let y = hairPos.getY(i);
    let z = hairPos.getZ(i);
    if (y > 0.25) {
      hairPos.setY(i, y * 1.18);
      hairPos.setZ(i, z + 0.14 * Math.sin(y * 3.2));
    }
  }
  hairGeo.computeVertexNormals();
  const hairMat = new THREE.MeshStandardMaterial({
    color: 0x0B1626,
    roughness: 0.65,
    metalness: 0.35,
    emissive: 0x002B47,
    emissiveIntensity: 0.3
  });
  hairMesh = new THREE.Mesh(hairGeo, hairMat);
  hairMesh.position.set(0, 0.45, -0.15);
  hairMesh.scale.set(0.96, 0.88, 1.05);
  headGroup.add(hairMesh);

  // 3. Piercing Luminous Cyan Eyes with Animated Pupils & Eyelids (Blinking + Saccades)
  const eyeScleraMat = new THREE.MeshStandardMaterial({
    color: 0x00F5FF,
    roughness: 0.2,
    metalness: 0.4,
    emissive: 0x0099CC,
    emissiveIntensity: 0.6
  });
  const pupilMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  const eyelidMat = new THREE.MeshStandardMaterial({
    color: 0x72BFE6,
    roughness: 0.3,
    metalness: 0.5,
    emissive: 0x052A47,
    emissiveIntensity: 0.4
  });

  // Left Eye Assembly
  leftEyeGroup = new THREE.Group();
  leftEyeGroup.position.set(-0.45, 0.18, 1.12);
  const leftEyeBall = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), eyeScleraMat);
  leftEyeGroup.add(leftEyeBall);
  const leftPupil = new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 14), pupilMat);
  leftPupil.position.set(0, 0, 0.12);
  leftEyeGroup.add(leftPupil);
  const leftRing = new THREE.Mesh(
    new THREE.RingGeometry(0.11, 0.22, 24),
    new THREE.MeshBasicMaterial({ color: 0x00F0FF, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
  );
  leftRing.position.set(0, 0, 0.13);
  leftEyeGroup.add(leftRing);
  // Left Eyelid (for realistic blinking)
  leftEyelid = new THREE.Mesh(new THREE.SphereGeometry(0.17, 18, 18, 0, Math.PI * 2, 0, Math.PI / 2), eyelidMat);
  leftEyelid.rotation.x = Math.PI / 2;
  leftEyelid.scale.set(1.02, 0.05, 1.02); // open by default
  leftEyeGroup.add(leftEyelid);
  headGroup.add(leftEyeGroup);

  // Right Eye Assembly
  rightEyeGroup = new THREE.Group();
  rightEyeGroup.position.set(0.45, 0.18, 1.12);
  const rightEyeBall = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), eyeScleraMat);
  rightEyeGroup.add(rightEyeBall);
  const rightPupil = new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 14), pupilMat);
  rightPupil.position.set(0, 0, 0.12);
  rightEyeGroup.add(rightPupil);
  const rightRing = new THREE.Mesh(
    new THREE.RingGeometry(0.11, 0.22, 24),
    new THREE.MeshBasicMaterial({ color: 0x00F0FF, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
  );
  rightRing.position.set(0, 0, 0.13);
  rightEyeGroup.add(rightRing);
  // Right Eyelid
  rightEyelid = new THREE.Mesh(new THREE.SphereGeometry(0.17, 18, 18, 0, Math.PI * 2, 0, Math.PI / 2), eyelidMat);
  rightEyelid.rotation.x = Math.PI / 2;
  rightEyelid.scale.set(1.02, 0.05, 1.02); // open by default
  rightEyeGroup.add(rightEyelid);
  headGroup.add(rightEyeGroup);

  // 4. Articulated Jaw for Speech Lip-Sync & Mouth Form
  jawGroup = new THREE.Group();
  jawGroup.position.set(0, -0.6, 0.5);

  const jawGeo = new THREE.ConeGeometry(0.65, 0.8, 18, 2, true);
  jawGeo.rotateX(Math.PI);
  const jawMat = new THREE.MeshStandardMaterial({
    color: 0x76C6EF,
    roughness: 0.3,
    metalness: 0.6,
    emissive: 0x003355,
    emissiveIntensity: 0.4
  });
  const jawMesh = new THREE.Mesh(jawGeo, jawMat);
  jawMesh.position.set(0, -0.2, 0.2);
  jawGroup.add(jawMesh);

  // Subtle luminous mouth slit & lips
  const mouthMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.48, 0.08),
    new THREE.MeshBasicMaterial({ color: 0x00FFFF, side: THREE.DoubleSide })
  );
  mouthMesh.position.set(0, -0.04, 0.52);
  jawGroup.add(mouthMesh);

  headGroup.add(jawGroup);

  // 5. High-tech Cyber Neck Collar & Shoulders
  const neckGeo = new THREE.CylinderGeometry(0.65, 1.1, 1.1, 24, 2, true);
  const neckMat = new THREE.MeshStandardMaterial({
    color: 0x0E2540,
    metalness: 0.85,
    roughness: 0.2,
    emissive: 0x003B5C,
    emissiveIntensity: 0.35
  });
  const neckMesh = new THREE.Mesh(neckGeo, neckMat);
  neckMesh.position.set(0, -1.8, 0);
  headGroup.add(neckMesh);

  headGroup.position.set(0, 0.15, 0);
  avatarGroup.add(headGroup);
}

function createHoloHUD() {
  // 1. Transparent Holographic Glass Cylinder around the face (~10% opacity)
  const cylGeo = new THREE.CylinderGeometry(2.35, 2.35, 4.2, 36, 4, true);
  const cylMat = new THREE.MeshPhysicalMaterial({
    color: 0x00F0FF,
    transparent: true,
    opacity: 0.10,
    roughness: 0.1,
    transmission: 0.9,
    side: THREE.DoubleSide
  });
  cylinderMesh = new THREE.Mesh(cylGeo, cylMat);
  cylinderMesh.position.y = -0.1;
  scene.add(cylinderMesh);
  holoRings.push({ mesh: cylinderMesh, speed: 0.08 });

  // 2. Elegant Cyan Floating Concentric Ring
  const ring1 = new THREE.RingGeometry(2.32, 2.37, 64);
  const ringMat1 = new THREE.MeshBasicMaterial({
    color: 0x00F0FF,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
  });
  const meshRing1 = new THREE.Mesh(ring1, ringMat1);
  meshRing1.rotation.x = Math.PI / 2.25;
  meshRing1.position.y = -1.2;
  scene.add(meshRing1);
  holoRings.push({ mesh: meshRing1, speed: 0.35 });

  // 3. Elegant Electric Magenta Concentric Ring
  const ring2 = new THREE.RingGeometry(2.68, 2.73, 48);
  const ringMat2 = new THREE.MeshBasicMaterial({
    color: 0xFF3DDB,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.8
  });
  const meshRing2 = new THREE.Mesh(ring2, ringMat2);
  meshRing2.rotation.x = Math.PI / 2.25;
  meshRing2.position.y = -1.35;
  scene.add(meshRing2);
  holoRings.push({ mesh: meshRing2, speed: -0.22 });

  // 4. Upper Cyan Crown Ring
  const ring3 = new THREE.RingGeometry(2.25, 2.29, 48);
  const meshRing3 = new THREE.Mesh(ring3, ringMat1);
  meshRing3.rotation.x = Math.PI / 2.25;
  meshRing3.position.y = 1.4;
  scene.add(meshRing3);
  holoRings.push({ mesh: meshRing3, speed: 0.18 });
}

function createParticles() {
  const count = 100;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 5.0;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 4.5 - 0.2;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 3.2;

    if (Math.random() > 0.35) {
      colors[i * 3] = 0.0;
      colors[i * 3 + 1] = 0.94;
      colors[i * 3 + 2] = 1.0;
    } else {
      colors[i * 3] = 1.0;
      colors[i * 3 + 1] = 0.24;
      colors[i * 3 + 2] = 0.86;
    }
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.045,
    vertexColors: true,
    transparent: true,
    opacity: 0.75
  });

  particles = new THREE.Points(geometry, material);
  scene.add(particles);
}

function setupInteractions() {
  const container = document.getElementById('canvas-container');
  function onDown(x, y) { isPointerDown = true; pointerX = x; pointerY = y; pointerStartX = x; pointerStartY = y; pointerMoved = false; }
  function onMove(x, y) {
    if (!isPointerDown) return;
    const deltaX = x - pointerX; const deltaY = y - pointerY;
    if (Math.abs(x - pointerStartX) + Math.abs(y - pointerStartY) > 8) pointerMoved = true;
    pointerX = x; pointerY = y;
    if (featureCylinderVisible) { if (Math.abs(deltaX) > 0) featureCylinderTargetY += deltaX * 0.008; return; }
    targetRotationY += deltaX * 0.008;
    targetRotationX = Math.max(-0.35, Math.min(0.35, targetRotationX + deltaY * 0.008));
  }
  function onUp(x, y) {
    if (featureCylinderVisible && !pointerMoved && typeof x === 'number' && typeof y === 'number') selectFeatureAt(x, y);
    isPointerDown = false;
  }
  container.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));
  container.addEventListener('touchstart', e => { if (e.touches.length > 0) onDown(e.touches[0].clientX, e.touches[0].clientY); }, {passive: true});
  window.addEventListener('touchmove', e => { if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: true});
  window.addEventListener('touchend', e => { const t = e.changedTouches && e.changedTouches[0]; onUp(t ? t.clientX : undefined, t ? t.clientY : undefined); });
}

function onWindowResize() {
  const container = document.getElementById('canvas-container');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  const idleBob = Math.sin(time * 1.5) * 0.06;
  const idleSway = Math.sin(time * 0.8) * 0.04;

  if (avatarGroup) {
    if (!isPointerDown) {
      targetRotationY += (idleSway - targetRotationY) * 0.02;
      targetRotationX += (0.0 - targetRotationX) * 0.02;
    }
    avatarGroup.rotation.y += (targetRotationY - avatarGroup.rotation.y) * 0.1;
    avatarGroup.rotation.x += (targetRotationX - avatarGroup.rotation.x) * 0.1;
    avatarGroup.position.y = idleBob;
  }

  // Periodic Natural Eye Blinking
  if (time > nextBlinkTime) {
    isBlinking = true;
    blinkProgress = 0.0;
    nextBlinkTime = time + 3.0 + Math.random() * 3.5; // blink every 3-6.5 seconds
  }

  if (isBlinking) {
    blinkProgress += delta * 7.5; // ~130ms quick natural blink
    const blinkScale = Math.sin(Math.min(Math.PI, blinkProgress * Math.PI));
    if (leftEyelid && rightEyelid) {
      const scaleY = 0.05 + blinkScale * 0.95;
      leftEyelid.scale.y = scaleY;
      rightEyelid.scale.y = scaleY;
    }
    if (blinkProgress >= 1.0) {
      isBlinking = false;
      if (leftEyelid && rightEyelid) {
        leftEyelid.scale.y = 0.05;
        rightEyelid.scale.y = 0.05;
      }
    }
  }

  // Periodic Natural Eye Saccades (looking around subtly)
  if (time > nextEyeMoveTime) {
    eyeTargetX = (Math.random() - 0.5) * 0.05;
    eyeTargetY = (Math.random() - 0.5) * 0.04;
    nextEyeMoveTime = time + 2.0 + Math.random() * 3.0;
  }
  eyeCurrentX += (eyeTargetX - eyeCurrentX) * 0.12;
  eyeCurrentY += (eyeTargetY - eyeCurrentY) * 0.12;
  if (leftEyeGroup && rightEyeGroup) {
    leftEyeGroup.rotation.y = eyeCurrentX;
    leftEyeGroup.rotation.x = eyeCurrentY;
    rightEyeGroup.rotation.y = eyeCurrentX;
    rightEyeGroup.rotation.x = eyeCurrentY;
  }

  if (featureCylinderGroup) {
    featureCylinderGroup.rotation.y += (featureCylinderTargetY - featureCylinderGroup.rotation.y) * 0.12;
  }

  // Rotating holographic HUD rings
  holoRings.forEach(item => {
    item.mesh.rotation.z += item.speed * delta;
  });

  // Floating ambient cyber dust
  if (particles) {
    const pos = particles.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let y = pos.getY(i) + delta * 0.25;
      if (y > 2.8) y = -2.2;
      pos.setY(i, y);
    }
    pos.needsUpdate = true;
  }

  // Speech Lip-Sync & Articulation
  if (isSpeaking) {
    targetViseme = Math.abs(Math.sin(time * 12.0) * Math.cos(time * 7.5)) * 0.9;
  }

  visemeValue += (targetViseme - visemeValue) * 0.25;

  if (isGlbLoaded && glbModel) {
    const mouthNames = ['mouthopen', 'jawopen', 'viseme_aa', 'viseme_o', 'viseme_ih'];
    let hasMouthMorph = false;
    for (let name of mouthNames) {
      if (morphTargets[name]) {
        morphTargets[name].mesh.morphTargetInfluences[morphTargets[name].index] = visemeValue;
        hasMouthMorph = true;
      }
    }
    // The supplied model currently has no mouth morph targets. Keep a subtle
    // whole-avatar response until a rigged/lip-sync-ready model is supplied.
    if (!hasMouthMorph && glbModel) {
      const pulse = 1.0 + visemeValue * 0.008;
      glbModel.scale.setScalar((2.65 / 1.98760897) * pulse);
    }
  } else if (jawGroup) {
    jawGroup.rotation.x = visemeValue * 0.32;
    jawGroup.position.y = -0.6 - visemeValue * 0.07;
  }

  // A restrained hologram shimmer; brighter while J.A.R.V.I.S. is speaking.
  const wireGlow = (isSpeaking ? 0.78 : 0.68) + Math.sin(time * 2.1) * 0.08 + visemeValue * 0.12;
  wireframeOverlays.forEach(function (wire) {
    if (wire.material) wire.material.opacity = Math.max(0.35, Math.min(1.0, wireGlow));
  });

  renderer.render(scene, camera);
}

window.setViseme = function(val) {
  targetViseme = Math.max(0.0, Math.min(1.0, parseFloat(val) || 0));
};

window.setSpeaking = function(speaking) {
  isSpeaking = !!speaking;
  if (!isSpeaking) targetViseme = 0.0;
};

window.pulseAudio = function(level) {
  const lvl = Math.min(1.0, Math.max(0.0, parseFloat(level) || 0));
  targetViseme = lvl;
  if (avatarGroup) {
    avatarGroup.scale.set(1.0 + lvl * 0.05, 1.0 + lvl * 0.05, 1.0 + lvl * 0.05);
  }
};

window.addEventListener('DOMContentLoaded', init);
</script>
